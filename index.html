<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crónicas del Mandato - Temporada 1</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --card-bg: #18202c;
            --accent-color: #d97706;
            --accent-hover: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2a3447;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Estilos del Botón Principal */
        .btn {
            background-color: var(--accent-color);
            color: #fff;
            padding: 14px 32px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        /* Estilos del Modal (<dialog>) */
        .modal {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
        }

        /* Fondo oscuro translúcido */
        .modal::backdrop {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
        }

        .modal h3 {
            color: var(--accent-hover);
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        .modal p {
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <!-- Botón activador -->
    <button class="btn" id="openModalBtn">Entrar al Servidor (Temporada 1)</button>

    <!-- Modal Emergente -->
    <dialog class="modal" id="serverModal">
        <h3>¡Inscripción al Servidor!</h3>
        <p>Estás a punto de unirte al Servidor Fresco de la <strong>Temporada 1: El Despertar y el Crecimiento</strong>. Se está preparando tu equipo de supervivencia inicial.</p>
        
        <div class="modal-actions">
            <button class="btn-secondary" id="closeModalBtn">Cancelar</button>
            <button class="btn" id="confirmBtn">Confirmar y Entrar</button>
        </div>
    </dialog>

    <script>
        // Selección de elementos
        const modal = document.getElementById('serverModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const confirmBtn = document.getElementById('confirmBtn');

        // Abrir modal como overlay (showModal)
        openBtn.addEventListener('click', () => {
            modal.showModal();
        });

        // Cerrar modal al cancelar
        closeBtn.addEventListener('click', () => {
            modal.close();
        });

        // Acción al confirmar
        confirmBtn.addEventListener('click', () => {
            alert('¡Conexión establecida con el servidor!');
            modal.close();
        });

        // Cerrar si el usuario hace clic fuera del contenido del modal
        modal.addEventListener('click', (e) => {
            const dialogDimensions = modal.getBoundingClientRect();
            if (
                e.clientX < dialogDimensions.left ||
                e.clientX > dialogDimensions.right ||
                e.clientY < dialogDimensions.top ||
                e.clientY > dialogDimensions.bottom
            ) {
                modal.close();
            }
        });
    </script>

</body>
</html>
